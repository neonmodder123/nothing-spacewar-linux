name: Build SailfishOS TEST

on:
  workflow_dispatch:
    inputs:
      SFOS_VERSION:
        description: 'Target Sailfish OS Release'
        required: true
        default: '4.5.0.24'

permissions:
  contents: write

jobs:
  sailfishos_flashable:
    runs-on: ubuntu-22.04
    env:
      SFOS_RELEASE: ${{ github.event.inputs.SFOS_VERSION }}
      DEVICE: 'Spacewar'
      VENDOR: 'nothing'
      SFOS_ARCH: 'aarch64'
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Dependencies and Mer Tools
        run: |
          set -e
          sudo apt update
          sudo apt install -y build-essential ca-certificates cpio curl git libssl-dev lz4 python3-setuptools sudo unzip wget xz-utils tar bc bison flex jq kmod libtinfo5

          wget https://raw.githubusercontent.com/mer-tools/mer-sdk-tools/master/mb2 -O mb2
          chmod +x mb2
          sudo mv mb2 /usr/local/bin/

      - name: Clone Mer-Hybris Repositories
        run: |
          git clone --depth 1 https://github.com/mer-hybris/mer-hybris.git mer-hybris
          git clone --depth 1 https://github.com/mer-hybris/android.git mer-hybris/android

          mb2 -s $SFOS_RELEASE -t nothing-Spacewar-$SFOS_ARCH --debug -D mb2.target.extra_args="--without-api-check" init

      - name: Configure and Build Sailfish OS Image
        run: |
          tar -czf $DEVICE-source.tar.gz .

          # The main HADK script that patches the kernel, builds device packages, and creates the flashable image.
          # IMPORTANT: Ensure your kernel RPM spec file (e.g., rpm/dhd/kernel-nothing-spacewar.spec) is updated
          # to pull from the correct kernel source: https://github.com/Nonta72/android_kernel_nothing_sm7325.git
          ./rpm/dhd/helpers/build_packages.sh --build-source-image $DEVICE-source.tar.gz

      - name: Prepare the image
        run: |
          mkdir -p out
          
          # Find the generated flashable ZIP file and move it to the 'out' directory
          SFOS_ARCHIVE=$(find rpm/ -name "*$DEVICE*.zip" -type f -exec basename {} \;)
          echo "SFOS_ARCHIVE_NAME=$SFOS_ARCHIVE" >> $GITHUB_ENV
          mv rpm/$SFOS_ARCHIVE out/

      - name: Upload the archive to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SailfishOS-${{ env.SFOS_RELEASE }}-${{ env.DEVICE }}
          path: out/${{ env.SFOS_ARCHIVE_NAME }}
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "SFOS-${{ env.SFOS_RELEASE }}_${{ github.run_number }}"
          name: "Sailfish OS ${{ env.SFOS_RELEASE }} Build #${{ github.run_number }}"
          files: out/${{ env.SFOS_ARCHIVE_NAME }}
          body: |
            Automated Sailfish OS build for ${{ env.DEVICE }}
            Base Release: ${{ env.SFOS_RELEASE }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
